[package]
name = "diploma"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.1", features = ["json","secrets", "tls"] }
rocket_dyn_templates = { version = "0.2", features = ["tera"] }
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "1.1.7", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1.1.7", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
thiserror = "2.0.12"
argon2 = "0.5"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
rand_core = { version = "0.9.3", features = ["std"] }
validator = {version = "0.20", features = ["derive"]} 
validator_derive = "0.20"
regex = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
url = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "serde"] }
lettre_email = "0.9"
chrono = { version = "0.4", features = ["serde"] }
rocket_oauth2 = "0.5.0-rc.2"
serde_json = "1.0"

[dev-dependencies]
sea-orm-cli = "1.1.7"